; =================================================
; DERIVED PARAMETERS
; Expressions as strings
; =================================================
[Derived]
FREEZE='ISFIXED'
SUFFIX=if ("ISFIXED" -eq "true") { "fixed" } else { "spring" }
EXPERIMENT = "EXP" + "SUFFIX"
PERIOD=2 * [math]::PI / FREQ
;DT=if ([Math]::Round((2 * [Math]::PI / FREQ) / DT_DIV, 6) -lt [Math]::Round(0.5 * DX / [Math]::Sqrt(9.81 * DEPTH), 6)) { [Math]::Round((2 * [Math]::PI / FREQ) / DT_DIV, 6) } else { [Math]::Round(0.4 * DX / [Math]::Sqrt(9.81 * DEPTH),6) }
DT=[Math]::Round((2 * [Math]::PI / FREQ) / DT_DIV, 6)
CULLCOUNT = [Math]::Max(1, [int][Math]::Round(DT_DIV / 20))
; Wavelength (fully inlined, no PERIOD reuse)
WAVELENGHT=((2 * [math]::PI / FREQ) * (2 * [math]::PI / FREQ) * 9.81) / (2 * [math]::PI)

; Dimensions (fully inlined)
LENGHT=(500 + 4 * ((2 * [math]::PI / FREQ) * (2 * [math]::PI / FREQ) * 9.81) / (2 * [math]::PI))
WIDTH=(300 + 4 * ((2 * [math]::PI / FREQ) * (2 * [math]::PI / FREQ) * 9.81) / (2 * [math]::PI))
DEG_SHIFT = if (DEG -eq 90) { 90 } else { 90 - DEG }

BCE=if (DEG -eq 90) { 'absorb' } elseif (DEG -ge 30 -and DEG -lt 90) { 'absorb' } elseif (DEG -gt 90 -and DEG -le 150) { 'GenAbsZone' } else { '' }
BCW=if (DEG -eq 90) { 'absorb' } elseif (DEG -ge 30 -and DEG -lt 90) { 'GenAbsZone' } elseif (DEG -gt 90 -and DEG -le 150) { 'absorb' } else { '' }


; =================================================
; RUN NAME FORMAT
; Ordered list via index
; =================================================
[NameFormat]
1=angle___DEG___
2=dx___DX___
3=dt___DT___
4=freq___FREQ___
5=beam___BEAM___
6=___OBJPAN___

NameSeparator=_

; =================================================
; OUTPUT DIRECTORY STRUCTURE
; =================================================
[OutputStructure]
1=Dtheta30___EXPERIMENT___Angle___DEG___
2=___GRID___
3=___METHOD___
4=___RUN_NAME___


; =================================================
; METHODS
; =================================================
[Methods]
List=anysim

; ---- anysim ----
[Methods.anysim.Fixed]
WAVEZ=-1e-6
SHIPPOS={135.934, 0, 0}

[Methods.anysim.Loops]
; empty

; ---- vbm ----
[Methods.vbm.Fixed]
WAVEZ=16.3 - 1e-6

SHIPPOS={gridLength/2, gridWidth/2 ,0}


[Methods.vbm.Loops]
; empty

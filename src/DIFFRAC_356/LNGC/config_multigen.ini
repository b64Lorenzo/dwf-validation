[Template]
; Path is relative to the simulations root
TemplateFile=LNGC_template.input.xml

; Name of the generated file
OutputFileName=main.input.xml

; Placeholder format
; Prefix + KEY + Suffix
PlaceholderPrefix=___
PlaceholderSuffix=___

; =================================================
; GLOBAL FIXED PARAMETERS
; =================================================
[GlobalFixed]

; =================================================
; GLOBAL LOOP PARAMETERS
; Lists are comma-separated
; =================================================
[GlobalLoops]
ISFIXED=true, false 
DX=5, 2.5, 1
MESHFN=1500, 3000, 9000, 50000

; =================================================
; DERIVED PARAMETERS
; Expressions as strings
; =================================================
[Derived]
NrOfPointsX=LX / DX
NrOfPointsY=LY / DX
EXP = if ($ISFIXED) { "fixed" } else { "spring" }

; =================================================
; RUN NAME FORMAT
; Ordered list via index
; =================================================
[NameFormat]
1=mesh___MESHFN___
2=dx___DX___

NameSeparator=_

; =================================================
; OUTPUT DIRECTORY STRUCTURE
; =================================================
[OutputStructure]
1=___EXP___
2=___METHOD___
3=___RUN_NAME___


; =================================================
; METHODS
; =================================================
[Methods]
List=port, full

; ---- anysim ----
[Methods.port.Fixed]
ORIGIN=135.934,44.3,0.0
LY=100
LX=300

[Methods.port.Loops]
; empty

; ---- vbm ----
[Methods.full.Fixed]
LY=200
LX=500
ORIGIN=135.934,0.0,0.0

[Methods.full.Loops]
; empty
``